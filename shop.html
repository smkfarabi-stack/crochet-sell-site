<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Collection | Crochet Al-chemi</title>
  
  <!-- Google Fonts & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .shop-container {
      max-width: 1100px;
      margin: 0 auto 6rem;
      padding: 0 1.5rem;
    }

    .category-section {
      margin-top: 3.5rem;
    }

    .category-header {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .category-tag {
      font-size: 0.8rem;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--glass-border-hover);
      color: var(--accent-cyan);
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
      font-family: var(--font-sans);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .empty-category-msg {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.92rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- Header -->
  <header>
    <a href="index.html" class="brand-logo">
      <img src="assets/logo.svg" onerror="this.onerror=null; this.src='assets/logo.png';" alt="Crochet Al-chemi Logo">
      <div class="brand-title">Crochet Al-chemi</div>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop Collection</a>
      <a href="https://wa.me/8801989029586?text=Hi!%20I'm%20interested%20in%20wholesale%20pricing%20and%20bulk%20orders." target="_blank" rel="noopener">Wholesale Orders</a>
      <a href="shop.html" class="nav-btn">Explore Shop</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-badge">
      <span>🛍️</span> Full Shop Collection
    </div>
    <h1>Explore Our Handcrafted Creations</h1>
    <p class="slogan">"Categorized in Small, Medium, and Large custom creations."</p>
  </section>

  <!-- Categorized Products Container -->
  <main class="shop-container">
    
    <!-- Small Category -->
    <section class="category-section">
      <h2 class="category-header">
        Small Creations <span class="category-tag">Small</span>
      </h2>
      <div id="grid-small" class="grid"></div>
    </section>

    <!-- Medium Category -->
    <section class="category-section">
      <h2 class="category-header">
        Medium Creations <span class="category-tag">Medium</span>
      </h2>
      <div id="grid-medium" class="grid"></div>
    </section>

    <!-- Large Category -->
    <section class="category-section">
      <h2 class="category-header">
        Large Creations <span class="category-tag">Large</span>
      </h2>
      <div id="grid-large" class="grid"></div>
    </section>

  </main>

  <!-- Bottom Left Creator Attribution -->
  <div class="creator-info">
    Crafted by <a href="https://smkfarabi-stack.github.io/my-portfolio/" target="_blank" rel="noopener">SMK Farabi</a>
  </div>

  <!-- Load Product Data & Render Categorized Grid -->
  <script src="products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const categories = ['Small', 'Medium', 'Large'];

      function buildCardHTML(product) {
        const phone = (product.whatsappNumber || '+8801989029586').replace(/[^0-9]/g, '');
        const textMessage = encodeURIComponent(
          `Hi! I would like to inquire about:\n• ${product.name} (ID: ${product.id || 'N/A'})\n• Price: ${product.price}`
        );
        const waUrl = product.whatsappLink || `https://wa.me/${phone}?text=${textMessage}`;

        return `
          <article class="card">
            <div class="card-img-wrapper">
              <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x300/1e1035/38bdf8?text=Crochet+Al-chemi'">
            </div>
            <div class="card-content">
              <div>
                <h3 class="product-title">${product.name}</h3>
                <p class="product-desc">${product.description || 'Precision handcrafted crochet item.'}</p>
              </div>
              <div class="card-footer">
                <span class="price">${product.price}</span>
                <a href="${waUrl}" target="_blank" rel="noopener" class="btn-buy">Purchase</a>
              </div>
            </div>
          </article>
        `;
      }

      if (typeof PRODUCTS_DATA === 'undefined' || PRODUCTS_DATA.length === 0) {
        categories.forEach(cat => {
          document.getElementById(`grid-${cat.toLowerCase()}`).innerHTML = 
            '<p class="empty-category-msg">No products available.</p>';
        });
        return;
      }

      // Filter and render products into respective categories
      categories.forEach(cat => {
        const gridElement = document.getElementById(`grid-${cat.toLowerCase()}`);

        const filteredProducts = PRODUCTS_DATA.filter(product => {
          // Default to 'Small' if category is not defined
          const itemCategory = (product.category || 'Small').trim();
          return itemCategory.toLowerCase() === cat.toLowerCase();
        });

        if (filteredProducts.length === 0) {
          gridElement.innerHTML = `<p class="empty-category-msg">No items in ${cat} category yet.</p>`;
        } else {
          gridElement.innerHTML = filteredProducts.map(buildCardHTML).join('');
        }
      });
    });
  </script>
</body>
</html>
